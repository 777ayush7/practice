<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cool page</title>
    <link rel="stylesheet" href="STYLE.CSS">
<style>
/* Container wrapper with minimal outer breathing room */
.content-wrapper {
  padding: 10px 20px;
  width: 100%;       
  box-sizing: border-box; 
}

.only-grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); /* Slightly narrower column minimums */
  gap: 12px; /* Tightened gap between cards */
}

.grid-item {
  display: grid;             
  align-content: start;      
  justify-content: start;    
  
  min-height: 80px; /* Reduced card height */
  
  text-decoration: none;    
  color: black;             
  background-color: white;
  
  padding: 12px 16px; /* Snug inner padding (12px top/bottom, 16px left/right) */
  
  border: 2px solid black; 
  border-radius: 6px;
  font-weight: bold;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s ease-in-out;
}

/* Hover and active states stay clean and responsive */
.grid-item:hover {
  background-color: black;
  color: white;
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.grid-item:active {
  transform: translateY(-1px);
}

</style>
</head>
<body>
    <header class="header" id="global-header"></header>
    
    <main class="content-wrapper"> 
        <h4 class="page-title">Dashboard</h4>
        
        <div class="only-grid-container">
             <a href="portfolio.html" class="grid-item">Portfolio</a>
             <a href="services.html" class="grid-item">Our Services</a>
             <a href="about.html" class="grid-item">About Us</a>
             <a href="contact.html" class="grid-item">Contact</a>
        </div>
    </main>

     <script src="script.js"></script>
</body>
</html>
